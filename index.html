
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WalkCanvas公式サポートサイト">
  <title>WalkCanvas | 公式サイト</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f9fc;
      color: #172b4d;
      line-height: 1.8;
    }
    main {
      max-width: 680px;
      margin: 72px auto;
      padding: 0 24px;
    }
    h1 {
      font-size: 42px;
      letter-spacing: -1px;
      margin-bottom: 4px;
    }
    .accent { color: #1677ed; }
    .subtitle { color: #64748b; margin-bottom: 36px; }
    .card {
      display: block;
      background: white;
      padding: 24px;
      margin: 14px 0;
      border: 1px solid #e5eaf0;
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
    }
    .card:hover { border-color: #1677ed; }
    .card strong { font-size: 18px; }
    .card p { margin: 8px 0 0; color: #64748b; }
    footer {
      margin-top: 48px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Walk<span class="accent">Canvas</span></h1>
    <p class="subtitle">歩いた道が、あなただけの地図になる。</p>

    <a class="card" href="privacy.html">
      <strong>プライバシーポリシー</strong>
      <p>位置情報やヘルスケアデータの取扱いについて</p>
    </a>

    <a class="card" href="support.html">
      <strong>サポート・お問い合わせ</strong>
      <p>アプリの使い方やお問い合わせについて</p>
    </a>

    <footer>
      <p>運営者：宮原 健一</p>
      <p>© 2026 WalkCanvas</p>
    </footer>
  </main>
</body>
</html>
